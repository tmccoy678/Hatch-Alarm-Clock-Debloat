general = {
    name = "Rose";
    output_backend = "alsa";
    mdns_backend = "avahi";
    interpolation = "soxr";
    port = 5000;
    udp_port_base = 6001;
    udp_port_range = 10;
    ignore_volume_control = "no";
    volume_range_db = 60;
};

sessioncontrol = {
    allow_session_interruption = "yes";
    session_timeout = 10;
};

alsa = {
    output_device = "rosepipe";
    output_rate = 44100;
    output_format = "S16_LE";
    disable_synchronization = "yes";
};

diagnostics = {
    log_output_to = "syslog";
    log_verbosity = 0;
};
